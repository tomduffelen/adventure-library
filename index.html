<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Adventure Library</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2a2360">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Adventures">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#fffaf0; --parch2:#f8edd3; --ink:#2e2418; --ui:#1f1b2e;
  --good:#1f8a4c; --bad:#c03b3b; --hint:#fff6d1; --hintb:#e8b400;
}
body{--bg1:#2a2360;--bg2:#100d2b;--accent:#6b46c1;--accent2:#4c2f99;--soft:#efe9ff;--cell:#d7ecc9;--celltext:#1f1b2e}
body[data-theme=castle]{--bg1:#33246b;--bg2:#120c2e;--accent:#6b46c1;--accent2:#4a2c94;--soft:#efe9ff;--cell:#bfe0a8}
body[data-theme=space]{--bg1:#10275a;--bg2:#02040d;--accent:#1f6fd1;--accent2:#144f9c;--soft:#e2eeff;--cell:#1d2b4f}
body[data-theme=pirate]{--bg1:#0f6a78;--bg2:#05303a;--accent:#0b7f7f;--accent2:#075a5a;--soft:#dcf5f2;--cell:#8fd3ea}
body[data-theme=zoo]{--bg1:#6a2456;--bg2:#220a1c;--accent:#c0347a;--accent2:#8f2259;--soft:#fde7f1;--cell:#d9efc4}
body[data-theme=lighthouse]{--bg1:#22304d;--bg2:#070b16;--accent:#b7791f;--accent2:#8a5a12;--soft:#fdf2dc;--cell:#9ccbe6}
body[data-theme=sea]{--bg1:#0b5573;--bg2:#021a26;--accent:#e05a47;--accent2:#b23b2b;--soft:#ffe9e5;--cell:#a7dbe8}
body[data-theme=desert]{--bg1:#8a5520;--bg2:#2b1607;--accent:#9b2c2c;--accent2:#741f1f;--soft:#fbe9d7;--cell:#f1d9a3}
body[data-theme=snow]{--bg1:#2c4a86;--bg2:#0b1630;--accent:#4f6bd8;--accent2:#3651b5;--soft:#e7ecff;--cell:#eef4ff}
body[data-theme=fair]{--bg1:#7a1f2b;--bg2:#2a070c;--accent:#d6336c;--accent2:#a61e4d;--soft:#ffe3ec;--cell:#ffe8cc}
body[data-theme=easy1]{--bg1:#3d8b37;--bg2:#163d14;--accent:#2f9e44;--accent2:#237032;--soft:#ebfbee;--cell:#d3f9d8}
body[data-theme=easy2]{--bg1:#1d5fb8;--bg2:#0a1f45;--accent:#1c7ed6;--accent2:#1864ab;--soft:#e7f5ff;--cell:#d0ebff}
body[data-theme=easy3]{--bg1:#b07d10;--bg2:#3d2a03;--accent:#e67700;--accent2:#b35c00;--soft:#fff4e6;--cell:#fff3bf}
body[data-theme=easy4]{--bg1:#0c8599;--bg2:#06363f;--accent:#1098ad;--accent2:#0b7285;--soft:#e3fafc;--cell:#c5f6fa}
body[data-theme=easy5]{--bg1:#4f7a12;--bg2:#1a2a05;--accent:#5c940d;--accent2:#3f6b06;--soft:#f4fce3;--cell:#e9fac8}
body[data-theme=easy6]{--bg1:#8b3aa8;--bg2:#2e0d3b;--accent:#ae3ec9;--accent2:#862e9c;--soft:#f8f0fc;--cell:#f3d9fa}
body[data-theme=tower]{--bg1:#2b3a8f;--bg2:#0d1338;--accent:#4263eb;--accent2:#364fc7;--soft:#edf2ff;--cell:#dbe4ff}
body[data-theme=robot]{--bg1:#1f4a3a;--bg2:#08180f;--accent:#2f9e44;--accent2:#237032;--soft:#ebfbee;--cell:#1b2f4a}
body[data-theme=dino]{--bg1:#2f6b33;--bg2:#0f2612;--accent:#d2691e;--accent2:#a34f12;--soft:#fdeedd;--cell:#cfe8b5}

*{box-sizing:border-box;margin:0;padding:0}
html{background:#100d2b}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ui);min-height:100vh;background-color:var(--bg2);
  background-image:radial-gradient(ellipse at top,var(--bg1),var(--bg2) 75%);background-attachment:fixed;padding:0 12px 60px}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.55;animation:tw 3.5s infinite ease-in-out}
@keyframes tw{50%{opacity:.1}}
.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto}
button{font-family:inherit}

/* ---------- HOME ---------- */
.hero{text-align:center;color:#fff;padding:30px 8px 18px}
.hero .big{font-size:54px;line-height:1}
.hero h1{font:700 34px/1.15 'Fredoka';margin:10px 0 6px}
.hero p{font-size:18px;opacity:.85}
.guide{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:18px;color:#fff;margin-bottom:18px}
.guide summary{cursor:pointer;padding:14px 18px;font:600 17px 'Fredoka';list-style:none}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"▾";float:right;opacity:.7}
.guide[open] summary::after{content:"▴"}
.guide .gbody{padding:0 16px 18px;color:var(--ui)}
.guide .gbody>p{color:#fff;font-size:15px;margin:2px 4px 12px;opacity:.9}
.legend{display:grid;gap:12px}
.legend .lg{background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45}
.legend .lg b{font-weight:900}
.cardlist{display:grid;gap:14px}
.scard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:none;cursor:pointer;
  background:var(--parch);border-radius:20px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.3);
  transition:transform .12s}
.scard:active{transform:translateY(3px)}
.scard .cov{flex:0 0 86px;height:86px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:30px;letter-spacing:-2px;line-height:1.05;text-align:center;flex-wrap:wrap;padding:6px}
.scard .t{font:700 20px/1.2 'Fredoka';color:var(--ui);margin-bottom:4px}
.scard .b{font-size:15px;line-height:1.4;color:#4a4458}
.scard .m{margin-top:8px;font:800 13px 'Nunito';color:#6a6280;display:flex;gap:10px;flex-wrap:wrap}
.scard .done{color:var(--good)}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 0 8px;
  background:linear-gradient(var(--bg1) 70%,transparent)}
.iconbtn{flex:0 0 auto;height:44px;min-width:44px;border-radius:14px;border:none;cursor:pointer;
  background:rgba(255,255,255,.14);color:#fff;font:800 15px 'Nunito';display:flex;align-items:center;gap:5px;padding:0 10px;font-size:20px}
.iconbtn .c{font-size:14px;background:#ffd23f;color:#3a2a00;border-radius:99px;padding:1px 7px;font-weight:900}
.iconbtn.pulse{animation:pulse .8s 2}
@keyframes pulse{50%{transform:scale(1.18);background:#ffd23f}}
.track{flex:1;position:relative;height:14px;border-radius:99px;background:rgba(255,255,255,.16);margin:0 16px 0 6px}
.track .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.5),#fff);transition:width .8s}
.track .runner{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:24px;transition:left .8s}
.track .goal{position:absolute;right:-16px;top:50%;transform:translateY(-55%);font-size:24px}
.starchip{flex:0 0 auto;color:#ffd23f;font:900 17px 'Nunito';background:rgba(255,255,255,.14);height:44px;border-radius:14px;display:flex;align-items:center;padding:0 10px}
.bagrow{color:#fff;font-size:14px;font-weight:800;opacity:.92;margin:0 4px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bagrow .it{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 10px;font-size:15px}

/* ---------- CHAPTER ---------- */
.chap{text-align:center;color:#fff;margin:4px 0 16px;animation:in .45s ease}
.chap .num{font:800 13px 'Nunito';letter-spacing:2px;text-transform:uppercase;opacity:.75}
.chap .art{font-size:58px;line-height:1.15;margin:6px 0 2px;letter-spacing:4px}
.chap h2{font:700 27px/1.2 'Fredoka'}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- READ ALOUD STORY BOX ---------- */
.read{position:relative;background:linear-gradient(var(--parch),var(--parch2));border-radius:20px;
  padding:32px 22px 12px;margin:22px 0 14px;border:2px solid #e6cf9a;box-shadow:0 8px 0 #c9a96a,0 16px 34px rgba(0,0,0,.35);
  font-family:'Literata',Georgia,serif;color:var(--ink);font-size:19.5px;line-height:1.75;animation:in .45s ease;
  text-wrap:pretty;-webkit-font-smoothing:antialiased}
.read::before{content:"📖  READ ALOUD";position:absolute;top:-14px;left:18px;background:#8a5a1c;color:#fff;
  font:900 12px 'Nunito';letter-spacing:1.5px;padding:6px 12px;border-radius:99px;box-shadow:0 3px 0 #5e3c10}
.read p{margin:0 0 .85em}
.read b{font-weight:700}
.read.first>p:first-child::first-letter{float:left;font-size:3.2em;line-height:.82;font-weight:700;color:var(--accent2);padding:6px 8px 0 0}
/* dialogue: flows like a book, with a quiet speaker label */
.say{margin:.2em 0 .95em;padding:0 0 0 14px;border-left:3px solid var(--accent)}
.say+.say.same{margin-top:-.5em}
.say .who{display:flex;align-items:center;gap:6px;font:800 12.5px 'Nunito';letter-spacing:.9px;text-transform:uppercase;color:var(--accent2);margin-bottom:1px}
.say .av{font-size:17px;letter-spacing:0}
.say .tx{margin:0}

/* ---------- NOTEBOOK CALLOUT ---------- */
.note{background:#fff3b0;border:3px dashed #d29d00;border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:17px;line-height:1.45;animation:in .45s ease}
.note .lab{font:900 12px 'Nunito';letter-spacing:1.3px;color:#8a6400;margin-bottom:4px}

/* ---------- PUZZLE ---------- */
.puz{background:#fff;border-radius:20px;overflow:hidden;border:3px solid var(--accent);margin:22px 0 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:in .45s ease}
.puzhead{background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.puzhead .l{font:700 18px 'Fredoka'}
.puzhead .r{font:800 12px 'Nunito';letter-spacing:1px;text-transform:uppercase;opacity:.9;text-align:right}
.puzbody{padding:16px}
.q{font:700 20px/1.5 'Nunito';color:var(--ui);margin-bottom:12px}
.q ul{margin:8px 0 0 0;list-style:none}
.q li{padding:3px 0 3px 26px;position:relative}
.q li::before{content:"🔎";position:absolute;left:0;font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{font:700 19px/1.2 'Fredoka';min-height:62px;padding:10px 8px;border-radius:14px;border:3px solid #d9d2ea;background:var(--soft);
  color:var(--ui);cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.96)}
.opt.wrong{background:#fde5e5;border-color:#efaaaa;color:#b14a4a;text-decoration:line-through;opacity:.65;animation:shake .4s}
.opt.right{background:#dcf6e6;border-color:var(--good);color:var(--good)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--hint);border:2px solid var(--hintb);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:17px;line-height:1.45;animation:in .3s}
.hint .av{font-size:28px;line-height:1}
.hint .lab{font:900 12px 'Nunito';letter-spacing:1px;color:#8a6a00;text-transform:uppercase}
.correct{display:flex;align-items:center;gap:10px;background:#e2f7ea;border:2px solid #9ddcb6;border-radius:14px;padding:10px 14px;margin-top:14px;font:800 17px 'Nunito';color:var(--good);animation:in .3s}
.correct .s{font-size:28px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.35)}100%{transform:scale(1)}}

/* visuals */
.vbig{font-size:34px;text-align:center;letter-spacing:3px;line-height:1.35;margin:4px 0 6px}
.vcode{font:700 22px 'Fredoka';text-align:center;letter-spacing:2px;white-space:nowrap;overflow-x:auto;background:#fbf4e2;border:2px dashed #c9a96a;border-radius:12px;padding:12px 8px;margin:4px 0 10px;color:#5a3d12}
.vkey{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:14px}
.vkey span{background:#f3f0fa;border-radius:8px;padding:4px 2px;text-align:center;display:flex;flex-direction:column}
.vkey b{font:700 17px 'Fredoka'}
.vkey i{font-style:normal;color:#6a6280;font-weight:800}
.vkey.sym{grid-template-columns:repeat(4,1fr)}
.vkey.sym b{font-size:24px}
.vkey.morse b{font-size:19px;letter-spacing:1px}
.sec{color:#fff;font:700 23px 'Fredoka';margin:26px 4px 2px}
.secsub{color:#fff;opacity:.75;font-size:14px;font-weight:800;margin:0 4px 12px}
.tag{background:#ffd23f;color:#3a2a00;border-radius:99px;padding:1px 8px}
.vstrip{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.vstrip span{width:28px;height:30px;display:flex;align-items:center;justify-content:center;background:#f3f0fa;border-radius:6px;font:700 16px 'Fredoka'}
.vrow{display:flex;gap:4px;margin:4px 0}
.vrow .c{flex:1;min-width:0;background:#f4f2f8;border-radius:10px;padding:6px 2px;text-align:center;font-size:22px;line-height:1.35}
.vrow .n{font:800 13px 'Nunito';color:#6a6280}
.vcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vcards.two{grid-template-columns:1fr 1fr}
.vc{background:#f4f2f8;border-radius:12px;padding:8px 6px;text-align:center;font-size:14px;line-height:1.35}
.vc .n{font:700 15px 'Fredoka';color:var(--accent2)}
.vc .ic{font-size:28px;margin:2px 0}
.vc .ln{font-weight:800;color:#3c3550}
.vlegend{font-size:14px;font-weight:700;color:#5c5470;text-align:center;margin-top:8px;line-height:1.5}
.vline{display:flex;flex-direction:column;align-items:center;gap:2px;margin:4px auto;width:120px}
.vline div{width:100%;text-align:center;font:700 15px 'Fredoka';background:#f3f0fa;border-radius:6px;padding:1px 0}
.vline .zero{background:#ffe08a}
.hline{display:flex;gap:2px;overflow-x:auto;margin:6px 0}
.hline{gap:1px}.hline div{flex:1 1 0;min-width:0;text-align:center;font:700 11.5px 'Fredoka';background:#f3f0fa;border-radius:4px;padding:6px 0}
.hline .zero{background:#ffe08a}
.coords{border-collapse:separate;border-spacing:4px;margin:6px auto}
.coords td{width:46px;height:46px;background:#1b2f4a;border-radius:8px;text-align:center;font-size:26px}
.coords th{font:700 17px 'Fredoka';color:var(--accent2);width:24px}
.vtable{width:100%;border-collapse:collapse;font-size:15px}
.vtable th{background:var(--soft);font-weight:900;padding:6px 4px;text-align:left}
.vtable td{padding:6px 4px;border-bottom:1px solid #eee;font-weight:700}
.grid{display:grid;gap:4px;margin:6px auto 4px;width:max-content;max-width:100%}
.grid div{width:48px;height:48px;border-radius:8px;background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:27px}
.grid .st{box-shadow:0 0 0 3px #ff4f8b inset;background:#fff}
.dirs{text-align:center;font:700 19px/1.5 'Fredoka';margin:6px 0}
.compass{text-align:center;font:800 14px 'Nunito';color:#5c5470;margin-top:6px}
.clues{background:#fff8d8;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px;line-height:1.5}
.clues div{padding:2px 0}

/* ---------- CHOICES ---------- */
.choose{margin-top:20px;animation:in .45s ease}
.choose .lab{color:#fff;font:800 14px 'Nunito';letter-spacing:1.2px;text-transform:uppercase;margin:0 0 10px 4px;opacity:.85}
.btn{display:block;width:100%;text-align:left;font:700 20px/1.25 'Fredoka';padding:16px 18px;margin-bottom:12px;border-radius:18px;border:none;cursor:pointer;
  background:#ffd23f;color:#3a2a00;box-shadow:0 5px 0 #c99b00;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c99b00}
.btn small{display:block;font:700 15px 'Nunito';opacity:.8;margin-top:3px}
.btn.alt{background:#fff;box-shadow:0 5px 0 #bbb;color:var(--ui)}
.btn.center{text-align:center}

/* ---------- COVER & END ---------- */
.cover{background:linear-gradient(var(--parch),var(--parch2));border-radius:22px;padding:24px 20px;margin-top:16px;text-align:center;box-shadow:0 8px 0 #c9a96a,0 16px 34px rgba(0,0,0,.35);animation:in .45s}
.cover .art{font-size:60px;letter-spacing:4px}
.cover h1{font:700 30px/1.15 'Fredoka';color:var(--accent2);margin:8px 0}
.cover .bl{font-family:'Literata',serif;font-size:19px;line-height:1.6;color:var(--ink);margin-bottom:14px}
.cover .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cover .meta span{background:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:14px}
.helperbox{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4}
.helperbox .av{font-size:32px}
.cert{text-align:center;background:#fff;border:5px double #d1a43a;border-radius:18px;padding:18px 14px;margin:16px 0}
.cert .r{font:700 26px 'Fredoka';color:var(--accent2);margin:4px 0}
.cert .stars{font-size:26px;letter-spacing:2px;margin:6px 0;word-break:break-all}
.badges{text-align:center;margin:8px 0 16px}
.badge{display:inline-block;background:#fff;border:3px solid #ffd23f;border-radius:14px;padding:6px 12px;margin:4px;font:700 15px 'Fredoka'}
.tip{color:#fff;background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45;margin-bottom:14px}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,25,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet{background:#fffdf6;border-radius:22px;max-width:620px;width:100%;max-height:85vh;overflow:auto;padding:20px;animation:in .3s}
.sheet h3{font:700 24px 'Fredoka';margin-bottom:10px}
.sheet .nb{background:#fff3b0;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:17px;line-height:1.45}
.sheet .empty{color:#777;font-size:16px;margin-bottom:12px}
.sheet p{font-size:17px;margin-bottom:14px;line-height:1.5}
/* ---------- EASY READERS ---------- */
body.easy .read{font-family:'Andika','Nunito',sans-serif;font-size:27px;line-height:1.6;padding:34px 22px 14px;word-spacing:.08em}
body.easy .read::before{content:"📖  READ IT YOURSELF";background:var(--accent2);box-shadow:0 3px 0 rgba(0,0,0,.3)}
body.easy .read p{margin-bottom:.6em}
body.easy .say .who{font-size:14px}
body.easy .say .av{font-size:22px}
body.easy .q{font-family:'Andika','Nunito',sans-serif;font-size:26px;font-weight:700;line-height:1.45;margin-bottom:6px}
body.easy .qrow{flex-direction:column;align-items:flex-start;gap:4px}
body.easy .opts{grid-template-columns:1fr 1fr 1fr}
body.easy .opts.four{grid-template-columns:1fr 1fr}
body.easy .opt{font-family:'Andika','Nunito',sans-serif;font-size:25px;min-height:88px;font-weight:700}
body.easy .vbig{font-size:48px}
body.easy .hint{font-size:22px;font-family:'Andika','Nunito',sans-serif}
body.easy .correct{font-size:20px}
body.easy .chap h2{font-size:34px}
body.easy .chap .art{font-size:72px}
body.easy .btn{font-size:24px}
.hear{display:inline-flex;align-items:center;gap:6px;margin:2px 0 10px;border:none;border-radius:99px;background:#fff;box-shadow:0 2px 0 #d9c79c;
  font:800 16px 'Nunito';color:var(--accent2);padding:8px 14px;cursor:pointer}
.qrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qrow .hear{flex-shrink:0;white-space:nowrap;background:var(--soft);box-shadow:none}
.ertag{display:inline-block;background:#d3f9d8;color:#1b5e20;border-radius:99px;padding:2px 10px;font-weight:900}
.hero{padding:22px 8px 12px}
.hero .big{font-size:42px}
.hero h1{font-size:30px;margin:6px 0 4px}
.hero p{font-size:16px}
.guide{margin-bottom:14px}

<body data-theme="home">
<div class="sky" id="sky"></div>
<div class="wrap" id="app"></div>
<div id="modal"></div>

<!-- ======================= STORY DATA ======================= -->
<script id="data">
const AL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const say = (who, icon, text) => ({t:"say", who, icon, text});
const note = (text) => ({t:"note", text});
const fmtSigned = i => i > 0 ? "+" + i : i < 0 ? "−" + (-i) : "0";

const V = {
  big: s => `<div class="vbig">${s}</div>`,
  code: s => `<div class="vcode">${s}</div>`,
  a1z26: () => `<div class="vkey">${AL.map((l,i)=>`<span><b>${l}</b><i>${i+1}</i></span>`).join("")}</div>`,
  strip: () => `<div class="vstrip">${AL.map(l=>`<span>${l}</span>`).join("")}</div>`,
  symkey: pairs => `<div class="vkey sym">${pairs.map(([s,l])=>`<span><b>${s}</b><i>${l}</i></span>`).join("")}</div>`,
  row: cols => `<div class="vrow">${cols.map(c=>`<div class="c"><div class="n">${c[0]}</div>${c.slice(1).map(x=>`<div>${x}</div>`).join("")}</div>`).join("")}</div>`,
  cards: (list, two) => `<div class="vcards ${two?"two":""}">${list.map(c=>`<div class="vc"><div class="n">${c.n}</div><div class="ic">${c.icon}</div>${(c.lines||[]).map(x=>`<div class="ln">${x}</div>`).join("")}</div>`).join("")}</div>`,
  legend: s => `<div class="vlegend">${s}</div>`,
  vline: (top, bottom, fmt) => { let h = `<div class="vline">`; for (let i = top; i >= bottom; i--) h += `<div class="${i===0?"zero":""}">${fmt?fmt(i):i}</div>`; return h + `</div>`; },
  hline: (a, b) => { let h = `<div class="hline">`; for (let i = a; i <= b; i++) h += `<div class="${i===0?"zero":""}">${i<0?"−"+(-i):i}</div>`; return h + `</div>`; },
  table: (head, rows) => `<table class="vtable"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`,
  clues: list => `<div class="clues">${list.map(c=>`<div>${c}</div>`).join("")}</div>`,
  grid: (rows, start, cell) => {
    const cells = rows.map(r => r.split(" "));
    const cols = cells[0].length;
    let h = `<div class="grid" style="grid-template-columns:repeat(${cols},auto)${cell?`;--cell:${cell}`:""}">`;
    cells.forEach(r => r.forEach(c => { h += `<div class="${c===start?"st":""}">${c==="."?"":c}</div>`; }));
    return h + `</div>`;
  }
};

/* ================================================================
   STORY 1 — THE CASE OF THE VANISHING SPELLBOOK
   ================================================================ */
const CASTLE = {
  id:"castle", theme:"castle", start:"intro", length:"medium", mins:"15",
  title:"The Case of the Vanishing Spellbook",
  cover:"🏰📖🔍", coverBg:"#e9e0ff",
  blurb:"Someone has stolen Wizard Bramble's spellbook on the morning of his birthday! Gather clues, crack codes and catch the thief.",
  helper:{name:"Wizard Bramble", icon:"🧙‍♂️"},
  runner:"🔍", goal:"📖",
  ranks:["Grand Detective of the Castle","Senior Detective","Junior Detective"],
  bag: st => {
    const out = [`🔍 Clues: ${st.notes.length}/4`];
    if (st.items.has("key")) out.push("🗝️ Iron key");
    if (st.items.has("gribble")) out.push("👺 Gribble");
    return out;
  },
  badges:{stairs:"🪜 Lift Rider", laundry:"🧺 Laundry Diver", maze:"🌿 Maze Runner", ferry:"⛵ Ferry Passenger"},
  ending: st => [
    `That evening, Castle Thistlewick holds the biggest birthday party it has ever seen. Lanterns float in the air. Ember the dragon lights the candles (very, very carefully). Gribble dances on the table, and Pip the owl hoots "Happy Birthday" perfectly in tune.`,
    say("Wizard Bramble","🧙‍♂️",`Apprentice, you found my spellbook AND my birthday cake. You're the finest detective this castle has ever had!`),
    `He pins a shiny silver badge onto your cloak. It has a magnifying glass on it, and it says <b>CASTLE DETECTIVE</b>.`,
    `And Mrs Crumble? She promises that next time she borrows a book, she'll write her note in plain old letters.`
  ],
  scenes:{
    intro:{ name:"The Empty Shelf", art:"🧙‍♂️📚❓",
      story:[
        `It's the morning of Wizard Bramble's birthday, and Castle Thistlewick is buzzing with excitement. You are Bramble's apprentice, and you've been up since sunrise polishing his wands.`,
        `Suddenly, a howl echoes down the corridor.`,
        say("Wizard Bramble","🧙‍♂️",`My spellbook! My Great Big Book of Spells has VANISHED! It was on the top shelf of the library last night, and this morning — gone!`),
        say("Wizard Bramble","🧙‍♂️",`I was in my workshop right next door all night, brewing a cough potion. And I didn't hear a thing. Not a creak. Not a squeak. Not a single CLANK.`),
        note(`Wizard Bramble was right next door to the library all night. He didn't hear a single sound — not even a clank.`),
        `Pinned to the empty shelf is a scrap of paper. There are no words on it — only numbers.`,
        say("Wizard Bramble","🧙‍♂️",`You're good at puzzles, apprentice. What does it say?`)
      ],
      puzzle:{ tag:"Secret code",
        q:`Each number stands for a letter: A is 1, B is 2, C is 3, and so on. What word does the note say?`,
        vis: V.code("19 · 15 · 18 · 18 · 25") + V.a1z26(),
        options:["SORRY","STORY","WORRY","SOFTY","SORTS","SPRAY"], answer:"SORRY",
        hints:[`Use the key! Find 19. Which letter sits on top of it?`,`19 is S and 15 is O. Now find 18 and 25.`,`S, O, R, R… and 25 is Y.`],
        win:[
          `"SORRY," you read out.`,
          say("Wizard Bramble","🧙‍♂️",`Sorry? A thief who says sorry? How very peculiar. A good detective remembers everything, apprentice — so don't forget that.`)
        ]},
      after:[{to:"library", label:"Search the library ➜"}]
    },

    library:{ name:"The Scene of the Crime", art:"📚👻",
      story:[
        `The library is a terrible mess. Books are scattered across the floor, some still flapping their pages like startled birds.`,
        `Floating above them is Miss Whisper, the castle's ghostly librarian. She has no feet at all — just a wispy tail of mist — so she never walks anywhere. She glides.`,
        say("Miss Whisper","👻",`Oh, my poor books! There were 24 books on the spellbook's shelf last night. I need to know how many are still up there, but I'm far too upset to count.`)
      ],
      puzzle:{ tag:"Fractions",
        q:`Half of the 24 books fell off the shelf. Then a quarter of the books still on the shelf fell off too. How many books are left on the shelf?`,
        vis: V.big("📚 × 24"),
        options:["9","12","6","3","18","8"], answer:"9",
        hints:[`Do it in two steps. First: what is half of 24? That's how many are still on the shelf.`,`12 books are still on the shelf. Now a quarter of those 12 fall off. Split 12 into 4 equal groups — one group falls.`,`A quarter of 12 is 3. So 12 take away 3 is…?`],
        win:[
          say("Miss Whisper","👻",`Nine. Thank you, dear.`),
          `You look up at where the spellbook was kept. It's the very top shelf — so high it almost touches the ceiling. The library ladder stands in the corner, covered in thick, undisturbed dust. Nobody has moved it.`,
          note(`The spellbook was kept on the very top shelf, and nobody moved the ladder. So whoever took it could reach VERY high up.`),
          `Where should you look next? Bramble says the Moving Staircase goes down to the cellars — or you could take the quick way and jump down the Laundry Chute!`
        ]},
      after:[
        {to:"stairs", label:"Ride the Moving Staircase 🪜", sub:"Down to the dark cellars"},
        {to:"laundry", label:"Jump down the Laundry Chute 🧺", sub:"Wheeee!"}
      ]
    },

    stairs:{ name:"The Moving Staircase", art:"🪜✨",
      story:[
        `The Moving Staircase is the most magical staircase in the castle. It's really more like a lift. You step onto the top stair, and a brass voice announces, "Floor three!"`,
        `There's a button for every floor. Floor 0 is the ground floor. The floors underground have minus numbers: minus one, minus two, minus three.`,
        `The staircase lurches UP two floors first… and then it starts going DOWN seven floors!`
      ],
      puzzle:{ tag:"Minus numbers",
        q:`You start on floor 3. You go up 2 floors, then down 7 floors. Which floor do you end up on?`,
        vis: V.vline(5,-3,i=>i===0?"0 (ground)":i<0?"−"+(-i):i),
        options:["−2","2","−4","12","−1","−3"], answer:"−2",
        hints:[`First go up 2 from floor 3. Which floor are you on now?`,`You're on floor 5. Now count down 7 floors, one at a time, using the buttons. Don't forget floor 0!`,`5, 4, 3, 2, 1, 0, minus 1… one more step down!`],
        win:[
          `DING! "Floor minus two," says the brass voice. The doors open onto a dark cellar full of barrels.`,
          `A mouse in a tiny velvet waistcoat steps out in front of you.`,
          say("Mortimer the Mouse","🐭",`I am Mortimer, Keeper of the Cellar! No one passes without solving my number riddle!`)
        ]},
      after:[{to:"stairs2", label:"Listen to Mortimer's riddle ➜"}]
    },

    stairs2:{ name:"Mortimer's Riddle", art:"🐭🔢",
      story:[
        say("Mortimer the Mouse","🐭",`I'm thinking of a number with two digits — a tens digit and a ones digit. Listen VERY carefully!`)
      ],
      puzzle:{ tag:"Number riddle",
        q:`"My two digits add up to 9. My tens digit is double my ones digit. What number am I?"`,
        vis: V.big("❓ ❓<br><span style='font-size:15px;letter-spacing:0'>tens · ones</span>"),
        options:["63","36","54","81","72","90"], answer:"63",
        hints:[`Which two-digit numbers have digits that add up to 9? For example 18, because 1 + 8 = 9…`,`Now look for one where the first digit is twice as big as the second.`,`Try 6 and 3. Do they add up to 9? Is 6 double 3?`],
        win:[
          say("Mortimer the Mouse","🐭",`Sixty-three! Correct!`),
          `Mortimer twirls his whiskers and scurries off. He comes back with a crumb dusted in white flour.`,
          say("Mortimer the Mouse","🐭",`I found this on the cellar stairs this morning. Somebody went UP to the Great Hall in a terrible hurry.`)
        ]},
      after:[{to:"hall", label:"Climb up to the Great Hall ➜"}]
    },

    laundry:{ name:"The Laundry Chute", art:"🧺🧦",
      story:[
        `WHEEEEEE! You whizz down the twisty laundry chute and land — FLUMP — in an enormous pile of warm washing.`,
        `Across the laundry room, six things are drying in a row on a washing line. A label pinned to the line says <b>Sir Clank's washing is on this line</b>.`,
        say("Wizard Bramble","🧙‍♂️",`Sir Clank is our walking suit of armour. He CLANKS so loudly with every step that he wakes up the whole castle! If we find his washing, he can't be far away.`)
      ],
      puzzle:{ tag:"Detective logic",
        q:`Which one belongs to Sir Clank?<ul><li>It is to the RIGHT of the scarf.</li><li>It is right NEXT TO the sock.</li><li>It is NOT the hat.</li></ul>`,
        vis: V.row([["1","👕"],["2","🧣"],["3","🎩"],["4","🧦"],["5","🧤"],["6","👗"]]),
        options:["👕 Shirt","🧣 Scarf","🎩 Hat","🧦 Sock","🧤 Gloves","👗 Dress"], answer:"🧤 Gloves",
        hints:[`Find the scarf first. Only things to its RIGHT can be the answer.`,`Now find the sock. Which things are touching it, one on each side?`,`The hat and the gloves are both next to the sock. But it's NOT the hat…`],
        win:[
          `Sir Clank's enormous iron gloves! Just then — CLANK! CLANK! CLANK! — in marches Sir Clank himself, so loudly that the windows rattle.`,
          say("Sir Clank","🛡️",`My gloves! Thank you, young detective. I'll help you — if you can answer the riddle my grandfather's helmet taught me.`)
        ]},
      after:[{to:"laundry2", label:"Hear Sir Clank's riddle ➜"}]
    },

    laundry2:{ name:"Sir Clank's Riddle", art:"🛡️❓",
      story:[
        say("Sir Clank","🛡️",`Listen well!`)
      ],
      puzzle:{ tag:"Riddle",
        q:`"I'm small and made of metal. I have teeth, but I never bite or chew. Turn me the right way, and a door will open for you." What am I?`,
        vis: V.big("🦷 🚪 ❓"),
        options:["🔑 A key","🐊 A crocodile","🪚 A saw","🔒 A lock","🦷 A tooth","🍴 A fork"], answer:"🔑 A key",
        hints:[`It has "teeth", but not real teeth — they're bumpy metal edges.`,`You turn it to open a door…`],
        win:[
          say("Sir Clank","🛡️",`A key! Exactly right. And here's a real one for you — it opens the back door of the Great Hall.`),
          `He hands you a heavy iron key.`
        ]},
      onWin: st => st.items.add("key"),
      after:[{to:"hall", label:"Unlock the Great Hall ➜"}]
    },

    hall:{ name:"Footprints in the Flour", art:"🍞👣",
      story:[
        `In the Great Hall, breakfast is being laid out on a table as long as a bus. Mrs Crumble, the castle cook, is setting down a mountain of muffins. She's a giant — so tall she has to duck under every doorway — and her apron is always covered in flour.`,
        say("Mrs Crumble","👩‍🍳",`Morning, dears! Muffin? … The spellbook? No, no, I haven't seen it. Not at all. Nope.`),
        `She suddenly becomes very busy with the muffins.`,
        `Then you spot something on the stone floor: a trail of white, floury footprints leading away from the library door. On every tile there's a number scratched into the stone.`,
        note(`A trail of floury footprints leads away from the library. The thief walked out on FEET.`),
        say("Wizard Bramble","🧙‍♂️",`The numbers make a pattern. Find the next number and we'll know which tile the footprints go to!`)
      ],
      puzzle:{ tag:"Pattern",
        q:`The footprints cross tiles numbered 1, 3, 6, 10… What number is on the next tile?`,
        vis: V.big("👣1 → 👣3 → 👣6 → 👣10 → ❓"),
        options:["15","14","13","16","12","20"], answer:"15",
        hints:[`Look at how much the number grows each time. 1 to 3 is +2.`,`3 to 6 is +3. 6 to 10 is +4. What will the next jump be?`,`The next jump is +5. What's 10 + 5?`],
        win:[`Tile 15! The footprints stop right by the big doors to the courtyard. Whoever took the spellbook went outside!`]},
      after:[{to:"courtyard", label:"Follow the trail outside ➜"}]
    },

    courtyard:{ name:"The Snoring Dragon", art:"🐉💤🦉",
      story:[
        `Out in the sunny courtyard lies Ember, the castle dragon, curled up like an enormous cat. Perched on the end of her nose is Pip the owl, fast asleep with his head tucked under his wing.`,
        `Sitting on the edge of the well, swinging his legs, is Gribble the goblin. He's very small — he only comes up to your knee — with ears like two floppy cabbage leaves.`,
        say("Gribble","👺",`Lookin' for clues? I was out here ALL night, counting stars. And I can tell you: Ember never moved. She snored all night long, with Pip asleep on her nose. I even counted the snores!`),
        note(`Gribble says Ember the dragon snored all night without moving, with Pip the owl asleep on her nose.`),
        say("Wizard Bramble","🧙‍♂️",`Hmm. Gribble does love a tall tale. Let's check his counting.`)
      ],
      puzzle:{ tag:"Maths",
        q:`Ember snores 4 times every minute. Gribble counted for 6 minutes. Then he heard 3 extra-loud snores. How many snores did he count altogether?`,
        vis: V.big("💤💤💤💤 every minute<br>⏱️ × 6  +  💥💥💥"),
        options:["27","24","13","10","30","21"], answer:"27",
        hints:[`First work out the snores in 6 minutes. That's 6 lots of 4.`,`Count in fours: 4, 8, 12, 16, 20, 24. Now add the 3 extra snores.`,`24 + 3 = ?`],
        win:[
          say("Gribble","👺",`Twenty-seven! Exactly what I counted!`),
          say("Wizard Bramble","🧙‍♂️",`Then I believe you, Gribble.`),
          `Gribble hops down from the well. "Can I come too? I LOVE a mystery!" To reach the Back Tower, you can go through the Hedge Maze, or take the little ferry across the moat.`
        ]},
      onWin: st => st.items.add("gribble"),
      after:[
        {to:"maze", label:"Go through the Hedge Maze 🌿", sub:"Gribble knows the way"},
        {to:"ferry", label:"Take the Moat Ferry ⛵", sub:"There's a grumpy troll"}
      ]
    },

    maze:{ name:"The Hedge Maze", art:"🌿🌿🌿",
      story:[
        `The Hedge Maze is taller than a house, and every path looks the same. Gribble climbs onto your shoulders to see over the top.`,
        say("Gribble","👺",`From where you're standing: go DOWN 1 square, then RIGHT 2 squares, then UP 3 squares!`)
      ],
      puzzle:{ tag:"Map", type:"grid",
        q:`Put your finger on 🧒 (that's you). Follow Gribble's directions. Where do you end up?`,
        grid:["⛲ . 🌹 . 🦉",". . . 🐇 .","🍄 . 🧒 . .",". 🐢 . . .","🌳 . 🗿 . 🦔"],
        start:"🧒", moves:[["D",1],["R",2],["U",3]],
        options:["🦉 Owl statue","⛲ Fountain","🦔 Hedgehog","🗿 Stone head","🐇 Rabbit","🌹 Rose bush"], answer:"🦉 Owl statue",
        hints:[`Move down ONE square first — towards the bottom of the map.`,`Now slide 2 squares to the right. Then 3 squares up, towards the top.`,`You should be in the top-right corner. What's there?`],
        win:[`The owl statue! Behind it is a little gate, and a winding path leads straight to the Back Tower.`]},
      after:[{to:"tower", label:"Hurry to the Back Tower ➜"}]
    },

    ferry:{ name:"The Moat Ferry", art:"⛵🧌",
      story:[
        `Down at the castle moat, a grumpy old troll in a woolly hat runs a little ferry boat.`,
        say("Ferry Troll","🧌",`Three coins for grown-ups. Two coins for children. Two coins for goblins. No coins, no boat!`),
        `Bramble, you and Gribble all climb aboard. Bramble pays with one shiny 10-coin piece.`
      ],
      puzzle:{ tag:"Money",
        q:`Bramble pays 3 coins for himself, and 2 coins each for you and Gribble. He pays with a 10-coin piece. How much change should he get?`,
        vis: V.big("🧙‍♂️ 3  +  🧒 2  +  👺 2<br>paid: 🪙10"),
        options:["3","7","5","4","13","6"], answer:"3",
        hints:[`First add up the cost: 3 for Bramble, 2 for you and 2 for Gribble.`,`That's 7 coins. Bramble paid 10. How much more is 10 than 7?`,`Count up from 7 to 10: 8, 9, 10…`],
        win:[`Three coins change! The troll grumbles, but hands it over, and paddles you across the moat to the Back Tower.`]},
      after:[{to:"tower", label:"Climb out at the Back Tower ➜"}]
    },

    tower:{ name:"The Detective's Test", art:"🛡️🗼",
      story: st => [
        st.path.includes("laundry")
          ? `At the foot of the Back Tower, Sir Clank is back on guard duty. CLANK! CLANK! He salutes you.`
          : `At the foot of the Back Tower stands Sir Clank, the castle's walking suit of armour. Every time he moves — CLANK! CLANK! CLANK! — the whole courtyard echoes.`,
        say("Sir Clank","🛡️",`Halt! At the top of this tower is the castle's secret Detective Room. Only a TRUE detective may enter, and a true detective remembers everything. So tell me: the thief left a note on the empty shelf. What did it say?`)
      ],
      puzzle:{ tag:"Memory",
        q:`What word was on the thief's secret note?`,
        vis: V.big("📝 ❓"),
        options:["SORRY","STORY","WORRY","SOFTY","SORTS","SPRAY"], answer:"SORRY",
        hints:[`Think back to the very beginning, when you found the note full of numbers…`,`It's a word people say when they feel bad about something they've done.`],
        win:[say("Sir Clank","🛡️",`SORRY! Correct! A true detective indeed. Up you go!`)]},
      after:[{to:"detective", label:"Climb to the Detective Room ➜"}]
    },

    detective:{ name:"Who Took the Spellbook?", art:"🔍🧵📌",
      story:[
        `At the top of the tower is a round room with a big board covered in pins and string: the Detective Room. You open your notebook and read every clue out loud.`,
        say("Wizard Bramble","🧙‍♂️",`Everyone in the castle is a suspect. Use ALL your clues to work out who took my spellbook!`)
      ],
      puzzle:{ tag:"Detective",
        q:`Read your clues. Who took the spellbook?`,
        vis: st => V.clues(st.notes.map(n=>"📒 "+n)) + V.cards([
          {n:"Miss Whisper", icon:"👻", lines:["a ghost","floats — no feet"]},
          {n:"Sir Clank", icon:"🛡️", lines:["suit of armour","CLANKS when he walks"]},
          {n:"Gribble", icon:"👺", lines:["a goblin","only knee-high"]},
          {n:"Ember", icon:"🐉", lines:["the dragon"]},
          {n:"Pip", icon:"🦉", lines:["the owl"]},
          {n:"Mrs Crumble", icon:"👩‍🍳", lines:["a giant cook","very tall"]}
        ], true),
        options:["👻 Miss Whisper","🛡️ Sir Clank","👺 Gribble","🐉 Ember","🦉 Pip","👩‍🍳 Mrs Crumble"], answer:"👩‍🍳 Mrs Crumble",

V.coords = (rows, cols) => {
  const n = rows.length;
  let h = `<table class="coords"><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
  rows.forEach((r,i)=>{ h += `<tr><th>${n-i}</th>${r.split(" ").map(c=>`<td>${c==="."?"":c}</td>`).join("")}</tr>`; });
  return h + `</table>`;
};

<script>
(function(){const s=document.getElementById('sky');for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.animationDelay=(Math.random()*3.5)+'s';s.appendChild(e)}})();

const app = document.getElementById('app');
const modal = document.getElementById('modal');
const ARW = {U:"⬆️",D:"⬇️",L:"⬅️",R:"➡️"};
const CMP = {U:"North",D:"South",L:"West",R:"East"};
let S=null, st=null, cur=null, attempts=0, solved=false, shown=[];

function loadP(){ try{ return JSON.parse(localStorage.getItem('adv-library-v1')||'{}'); }catch(e){ return {}; } }
function saveP(d){ try{ localStorage.setItem('adv-library-v1', JSON.stringify(d)); }catch(e){} }

/* longest path (in chapters) for the progress bar */
function maxLen(story){
  const memo={};
  const f=id=>{ if(id==='end') return 0; if(memo[id]!=null) return memo[id];
    const sc=story.scenes[id]; const nx=[...(sc.after||[]),...(sc.choices||[])].map(c=>c.to);
    return memo[id]=1+Math.max(0,...nx.map(f)); };
  return f(story.start);
}
function puzzleCount(story){
  const memo={};
  const f=id=>{ if(id==='end') return 0; if(memo[id]!=null) return memo[id];
    const sc=story.scenes[id]; const nx=[...(sc.after||[]),...(sc.choices||[])].map(c=>c.to);
    return memo[id]=(sc.puzzle?1:0)+Math.max(0,...nx.map(f)); };
  return f(story.start);
}

/* ---------- HOME ---------- */
function home(){
  S=null; document.body.dataset.theme='home'; document.body.classList.remove('easy'); modal.innerHTML='';
  const prog=loadP();
  let h=`<div class="hero"><div class="big">📚✨</div><h1>The Adventure Library</h1><p>Pick a story. You are the hero!</p><button class="installbtn" id="installBtn" onclick="installApp()">📲 Install as an app</button></div>
  <details class="guide"><summary>👋 For grown-ups: how to read these together</summary><div class="gbody">

    <div class="legend">

`;

  const groups=[["easy","🌱","Easy readers","For new readers to read by themselves"],["short","⚡","Quick","About 7 minutes · 5 puzzles"],["medium","📘","Adventures","About 15 minutes · 10 puzzles"],["long","🏔️","Epic","About 30 minutes · 16 puzzles · your place is saved"]];

  groups.forEach(([len,ic,name,sub])=>{
    h+=`<div class="tabpane" data-tab="${len}" style="${len===tab?'':'display:none'}"><div class="secsub">${sub}</div>`;
    const list=STORIES.filter(s=>s.length===len);
    const levels = len==='easy' ? [...new Set(list.map(s=>s.level))] : [null];
    levels.forEach(lv=>{
      if(lv) h+=`<div class="lvhead">Level ${lv} <span>${({1:'· short words, 4 puzzles',2:'· longer sentences, 5 puzzles',3:'· longer pages, 6 puzzles'})[lv]||''}</span></div>`;
      h+=`<div class="cardlist">`;
      list.filter(s=>!lv||s.level===lv).forEach(s=>{
        const p=prog[s.id]; const r=runs[s.id]&&runs[s.id].st&&runs[s.id].st.chapter>0;
        h+=`<button class="scard" onclick="openStory('${s.id}')">
          <div class="cov" style="background:${s.coverBg}">${s.cover}</div>
          <div class="sbody"><div class="t">${s.title}</div><div class="b">${s.blurb}</div>
          <div class="m">${s.easy?`<span class="ertag">🌱 Level ${s.level}</span>`:''}<span>⏱ ${s.mins} min</span>${r?`<span class="tag">▶ Ch ${runs[s.id].st.chapter+1}</span>`:''}${p?`<span class="done">✅ ⭐ ${p.best}/${p.of}</span>`:''}</div></div>
        </button>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="foot">Made for one very clever adventurer</div>`;
  app.innerHTML=h; window.scrollTo(0,0);
}

function setTab(k){
  try{ localStorage.setItem('adv-tab',k); }catch(e){}
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on', b.getAttribute('onclick')===`setTab('${k}')`));
  document.querySelectorAll('.tabpane').forEach(p=>p.style.display = p.dataset.tab===k ? '' : 'none');
}
/* ---------- STORY COVER ---------- */
function openStory(id){
  S=STORIES.find(s=>s.id===id); document.body.dataset.theme=S.theme; document.body.classList.toggle('easy', !!S.easy);
  app.innerHTML=`<div class="topbar"><button class="iconbtn" onclick="home()">🏠 <span style="font-size:15px">Library</span></button></div>
  <div class="cover"><div class="art">${S.cover}</div><h1>${S.title}</h1><div class="bl">${S.blurb}</div>
    <div class="meta"><span>⏱ About ${S.mins} minutes</span><span>🧩 ${puzzleCount(S)} puzzles</span><span>🔀 Different paths</span>${S.easy?`<span class="ertag">🌱 Easy reader · Level ${S.level} — read it yourself!</span>`:''}</div>
    <div class="helperbox"><div class="av">${S.helper.icon}</div><div><b>Your helper: ${S.helper.name}</b><br>If you get a puzzle wrong, ${S.helper.name.split(' ')[0]} will give you a hint.</div></div>
  </div>
  <div class="choose">${(()=>{
      const r=loadRun(id), p=loadP()[id];
      if(r) return `<div class="resumebox">🔖 <b>You've started this story before!</b><br>You got to <b>Chapter ${r.st.chapter+1}: ${S.scenes[r.cur].name||''}</b> with ⭐ ${r.st.stars} so far.</div>
        <button class="btn center" onclick="resume()">▶ Continue from Chapter ${r.st.chapter+1}</button>
        <button class="btn alt center" onclick="begin()">🔄 Start over from the beginning</button>`;
      if(p) return `<div class="resumebox">🏆 <b>You've finished this story before</b> — your best was ⭐ ${p.best} out of ${p.of}. Try a different path this time!</div>
        <button class="btn center" onclick="begin()">Play again ✨</button>`;
      return `<button class="btn center" onclick="begin()">Begin the adventure ✨</button>`;})()}</div>`;
  window.scrollTo(0,0);
}
/* one saved place PER STORY */
function allRuns(){
  try{
    const runs=JSON.parse(localStorage.getItem('adv-runs-v2')||'{}');
    const old=JSON.parse(localStorage.getItem('adv-run-v1')||'null');   // move an old single save across
    if(old&&old.id&&!runs[old.id]){ runs[old.id]=old; localStorage.setItem('adv-runs-v2',JSON.stringify(runs)); }
    if(old) localStorage.removeItem('adv-run-v1');
    return runs;
  }catch(e){ return {}; }
}
function loadRun(id){ const r=allRuns()[id||(S&&S.id)]; return r&&r.st&&r.st.chapter>0 ? r : null; }
function saveRun(id){ try{ const runs=allRuns(); runs[S.id]={id:S.id, cur:id, st:{...st, items:[...st.items]}}; localStorage.setItem('adv-runs-v2', JSON.stringify(runs)); }catch(e){} }
function clearRun(){ try{ const runs=allRuns(); delete runs[S.id]; localStorage.setItem('adv-runs-v2', JSON.stringify(runs)); }catch(e){} }
function resume(){ const r=loadRun(S.id); if(!r) return begin(); st={...r.st, items:new Set(r.st.items)}; go(r.cur); }
function begin(){
  clearRun();
  st={stars:0,puzzles:0,notes:[],items:new Set(),n:{},chapter:0,path:[],total:maxLen(S)};
  go(S.start);
}

/* ---------- SCENE ---------- */
function blocksOf(x){ return typeof x==='function' ? x(st) : (x||[]); }
function addNotes(blocks){ let added=false; blocks.forEach(b=>{ if(b&&b.t==='note'&&!st.notes.includes(b.text)){ st.notes.push(b.text); added=true; } }); return added; }

/* ---------- book-style speech ---------- */
const SHORT={"Wizard Bramble":"Bramble","Captain Barnacle Bess":"Captain Bess","Bubbles the dolphin":"Bubbles","Ellie the elephant":"Ellie",
 "Mortimer the Mouse":"Mortimer","Olive the otter":"Olive","Old Horace the goat":"Horace","Coco the clownfish":"Coco","Octavia the octopus":"Octavia",
 "Big Blue the whale":"the whale","Merla the Mermaid":"Merla","Meg the hen":"Meg","The Great Marvella":"Marvella","Glorp the Shopkeeper":"Glorp",
 "Station Guard":"the guard","The Chief of Space":"the Chief of Space","The Museum Director":"the museum director","Ferry Troll":"the troll",
 "Coconut Stall Keeper":"the stall keeper","Zib's Dad":"Zib's dad","Wise Owl":"the owl","Troll":"the troll","T-Rex":"the T-Rex","Hen":"the hen",
 "Pig":"the pig","Cat":"the cat","Little dog":"the little dog","Little chick":"the little chick","Mouse":"the mouse","Duck":"the duck","Worm":"the worm",
 "Bee":"a bee","Alien":"the alien","Red cat":"the red cat","Blue cat":"the blue cat","Green cat":"the green cat","Granny Mae":"Granny","Ranger Rosa":"Rosa"};
const VERB={"Polly":"squawks","BLIP":"beeps","Station Guard":"beeps","Mortimer the Mouse":"squeaks","Captain Wisp":"writes"};
function bookSay(b, tag){
  let t=b.text.replace(/"([^"]*)"/g,'‘$1’');
  if(!tag) return `“${t}”`;
  const name=(SHORT[b.who]||b.who).replace(/^The /,'the ');
  let s1=t, rest='';
  const m=t.match(/^(.+?[.!?…])\s+(?=[A-Z0-9‘(“])([\s\S]+)$/);
  const openInner = x => (x.match(/‘/g)||[]).length > (x.match(/’/g)||[]).length;
  if(m && !/\b(Mr|Mrs|Dr)\.$/.test(m[1]) && !openInner(m[1])){ s1=m[1]; rest=m[2]; }
  let verb = s1.endsWith('?') ? 'asks' : (VERB[b.who]||'says');
  if(verb!=='says' && verb!=='asks' && s1.toLowerCase().includes(verb.replace(/s$/,''))) verb='says';
  // reading something out, or no good place to split: put the speaker first
  if(!rest && (/[’]$/.test(t) || t.includes('‘') || t.length>110)){
    const Name=name.charAt(0).toUpperCase()+name.slice(1);
    if(/^(It|The [a-z]+|Jack's logbook) says:/.test(t)) verb='reads out';
    return `${Name} ${verb}, “${t}”`;
  }
  if(s1.endsWith('.')) s1=s1.slice(0,-1)+',';
  return `“${s1}” ${verb} ${name}.` + (rest?` “${rest}”`:'');
}
function readHTML(blocks, opening){
  let h='', open=false, lastWho=null, boxes=0;
  const openBox=()=>{ if(!open){ h+=`<div class="read${opening&&boxes===0&&!(S&&S.easy)&&typeof blocks[0]==='string'?' first':''}">`; open=true; boxes++; } };
  const closeBox=()=>{ if(open){ h+=hearBtn()+'</div>'; open=false; } };
  blocks.forEach(b=>{
    if(typeof b==='string'){ openBox(); h+=`<p>${b}</p>`; lastWho=null; }
    else if(b.t==='say'){ openBox(); h+=`<p>${bookSay(b, lastWho!==b.who)}</p>`; lastWho=b.who; return; }
    else if(b.t==='note'){ closeBox(); lastWho=null; h+=`<div class="note"><div class="lab">📒 NEW CLUE — SAVED IN YOUR NOTEBOOK</div>${b.text}</div>`; }
  });
  closeBox(); return h;
}
const CAN_SPEAK = (()=>{ try{ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined'; }catch(e){ return false; } })();
function hearBtn(){ return (S&&S.easy&&CAN_SPEAK) ? `<button class="hear" onclick="hear(this)">🔊 Hear it</button>` : ''; }
function hear(btn){
  try{
    const box=btn.closest('.read')||btn.closest('.qrow');
    const c=box.cloneNode(true);
    c.querySelectorAll('.hear,.who,.av').forEach(x=>x.remove());
    c.querySelectorAll('p,.say,li').forEach(x=>x.append('. '));
    const text=c.textContent.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').replace(/(\.\s*){2,}/g,'. ').trim();
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=0.8; u.lang='en-GB';
    speechSynthesis.speak(u);
  }catch(e){}
}

function topbar(){
  const pct = cur==='end' ? 100 : Math.min(94, Math.round((st.chapter-1)/st.total*100));
  return `<div class="topbar">
    <button class="iconbtn" onclick="askLeave()" aria-label="Back to library">🏠</button>
    <div class="track"><div class="fill" style="width:${pct}%"></div><span class="runner" style="left:${pct}%">${S.runner}</span><span class="goal">${S.goal}</span></div>
    <button class="iconbtn" id="nbBtn" onclick="openNotes()" aria-label="Notebook">📒<span class="c">${st.notes.length}</span></button>
    <div class="starchip">⭐ ${st.stars}</div>
  </div>
  <div class="bagrow">🎒 ${S.bag(st).map(x=>`<span class="it">${x}</span>`).join('')}</div>`;
}

function go(id){
  if(!S.scenes[id].end) saveRun(id);
  cur=id; attempts=0; solved=false; st.path.push(id);
  const sc=S.scenes[id];
  if(sc.end){ return ending(); }
  st.chapter++;
  if(sc.enter) sc.enter(st);
  const blocks=blocksOf(sc.story);
  const newNote=addNotes(blocks);
  let h=topbar();
  h+=`<div class="chap"><div class="num">Chapter ${st.chapter}</div><div class="art">${sc.art}</div><h2>${sc.name}</h2></div>`;
  h+=readHTML(blocks, true);
  if(sc.puzzle) h+=puzzleHTML(sc.puzzle);
  else h+=choicesHTML(sc.after||sc.choices||[]);
  h+=`<div id="after"></div>`;
  app.innerHTML=h;
  if(newNote) pulseNB();
  window.scrollTo({top:0,behavior:'smooth'});
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function puzzleHTML(p){
  shown=shuffle(p.options);
  let vis = typeof p.vis==='function' ? p.vis(st) : (p.vis||'');
  if(p.type==='grid'){
    vis = (p.hideDirs?'':`<div class="dirs">${p.moves.map(m=>`<span style="white-space:nowrap">${ARW[m[0]]} ${p.compass?CMP[m[0]]+' ':''}${m[1]}</span>`).join(' · ')}</div>`) + V.grid(p.grid,p.start,p.cell) + (p.compass?`<div class="compass">⬆️ North · ⬇️ South · ➡️ East · ⬅️ West</div>`:'') + (p.extra||'');
  }
  return `<div class="puz">
    <div class="puzhead"><span class="l">🧩 Puzzle · ${p.tag}</span><span class="r">${S.easy?"Your<br>turn!":"Solve it<br>together"}</span></div>
    <div class="puzbody"><div class="qrow"><div class="q">${p.q}</div>${hearBtn()}</div>${vis}
      <div class="opts ${p.options.length===4?'four':''}">${shown.map((o,i)=>`<button class="opt" onclick="answer(${i},this)">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div></div>`;
}

function choicesHTML(list){
  if(!list.length) return '';
  const lab = list.length>1 ? '🤔 What will you do?' : '📖 Turn the page';
  return `<div class="choose"><div class="lab">${lab}</div>${list.map(c=>`<button class="btn" onclick="go('${c.to}')">${c.label}${c.sub?`<small>${c.sub}</small>`:''}</button>`).join('')}</div>`;
}

function answer(i,el){
  if(solved) return;
  const sc=S.scenes[cur], p=sc.puzzle, fb=document.getElementById('fb');
  if(shown[i]===p.answer){
    solved=true; st.puzzles++;
    const first=attempts===0; if(first) st.stars++;
    el.classList.add('right');
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    if(sc.onWin) sc.onWin(st);
    const win=blocksOf(p.win); const newNote=addNotes(win);
    fb.innerHTML = first
      ? `<div class="correct"><span class="s">⭐</span>Correct, first try! You earned a star.</div>`
      : `<div class="correct"><span class="s">✅</span>You got it! Well worked out.</div>`;
    document.getElementById('after').innerHTML = readHTML(win) + choicesHTML(sc.after||[]);
    // refresh top bar counts
    const tb=document.querySelector('.topbar'); const br=document.querySelector('.bagrow');
    const tmp=document.createElement('div'); tmp.innerHTML=topbar();
    tb.replaceWith(tmp.children[0]); br.replaceWith(tmp.children[0]);
    if(newNote) pulseNB();
    setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'start'}),120);
  } else {
    attempts++;
    el.classList.add('wrong'); el.disabled=true;
    const hint=p.hints[Math.min(attempts-1,p.hints.length-1)];
    fb.innerHTML=`<div class="hint"><div class="av">${S.helper.icon}</div><div><div class="lab">💡 Not quite! Hint from ${S.helper.name}</div>${hint}</div></div>`;
  }
}

function pulseNB(){ const b=document.getElementById('nbBtn'); if(b){ b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); } }

/* ---------- ENDING ---------- */
function ending(){
  const ratio = st.puzzles ? st.stars/st.puzzles : 0;
  const rank = ratio===1 ? S.ranks[0] : ratio>=0.7 ? S.ranks[1] : S.ranks[2];
  const badges=[`🏆 Story complete`];
  Object.entries(S.badges).forEach(([k,v])=>{ if(st.path.includes(k)) badges.push(v); });
  if(ratio===1) badges.push('🌟 Perfect score');
  clearRun();
  const prog=loadP(); const old=prog[S.id];
  if(!old || st.stars>old.best) prog[S.id]={best:st.stars,of:st.puzzles};
  saveP(prog);
  let h=topbar();
  h+=`<div class="chap"><div class="num">The End</div><div class="art">🎉${S.goal}🎉</div><h2>${S.title}</h2></div>`;
  h+=readHTML(blocksOf(S.ending));
  h+=`<div class="cert"><div>📜 This certifies that <b>you</b> are now a</div><div class="r">${rank}</div>
     <div class="stars">${'⭐'.repeat(st.stars)}</div><div><b>${st.stars}</b> stars from <b>${st.puzzles}</b> puzzles</div></div>
     <div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div>
     <div class="tip">🔀 There are other paths through this story with different puzzles. Play again and choose differently to find them!</div>
     <div class="choose"><button class="btn center" onclick="begin()">Play this story again 🔄</button><button class="btn alt center" onclick="home()">Back to the Library 📚</button></div>`;
  app.innerHTML=h; window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- MODALS ---------- */
function closeModal(){ modal.innerHTML=''; }
function openNotes(){
  const list = st.notes.length ? st.notes.map(n=>`<div class="nb">📒 ${n}</div>`).join('') : `<div class="empty">No clues yet. Keep your eyes open!</div>`;
  modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>📒 Your Notebook</h3>${list}
    <p style="font-size:14px;color:#777;margin-top:10px">Not everything goes in the notebook. Some things you just have to remember!</p>
    <button class="btn center" onclick="closeModal()">Close</button></div></div>`;
}
function askLeave(){
  modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3>Leave this story?</h3>
    <p>Don't worry — your place is saved. Next time you open this story, you can carry on from this chapter.</p>
    <button class="btn center" onclick="closeModal()">Keep playing</button><button class="btn alt center" onclick="home()">Back to the Library</button></div></div>`;
}

/* ---------- APP INSTALL ---------- */
let deferredPrompt=null;
const isTop=(()=>{ try{ return window.self===window.top; }catch(e){ return false; } })();
const isStandalone=(()=>{ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } })();
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function showInstall(){ const b=document.getElementById('installBtn'); if(b && !isStandalone && (deferredPrompt || isTop)) b.style.display='block'; }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; showInstall(); });
window.addEventListener('appinstalled', ()=>{ deferredPrompt=null; const b=document.getElementById('installBtn'); if(b) b.style.display='none'; });
async function installApp(){
  if(deferredPrompt){ try{ deferredPrompt.prompt(); await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; const b=document.getElementById('installBtn'); if(b) b.style.display='none'; return; }
  const steps = isIOS
    ? `<h3>📲 Install on iPhone or iPad</h3>
       <p>1. Open this page in <b>Safari</b>.</p>
       <p>2. Tap the <b>Share</b> button <span style="font-size:22px">⬆️</span>.</p>
       <p>3. Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</p>`
    : /android/i.test(navigator.userAgent)
    ? `<h3>📲 Install on Android</h3>
       <p>1. Open this page in <b>Chrome</b>.</p>
       <p>2. Tap the <b>⋮</b> menu in the top corner.</p>
       <p>3. Tap <b>Install app</b> (or <b>Add to Home screen</b>).</p>`
    : `<h3>📲 Install on this computer</h3>
       <p>In <b>Chrome</b> or <b>Edge</b>, click the install icon <span style="font-size:20px">⊕</span> at the right-hand end of the address bar, or open the browser menu and choose <b>Install The Adventure Library</b>.</p>
       <p>On a phone or tablet, open this page there and tap this button again.</p>`;
  modal.innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${steps}
    <p style="font-size:15px;color:#666">Once installed, it opens full-screen like an app and works offline.</p>
    <button class="btn center" onclick="closeModal()">Got it</button></div></div>`;
}
try{ if('serviceWorker' in navigator && isTop && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}

home();
showInstall();
</script>
</body>
</html>
